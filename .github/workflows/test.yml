name: Test

on:
  push:
    branches:
      - main
      - dev
      - integrate/harmonyos
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run release tests
        run: cargo test --workspace --all-features --release --locked

      - name: Verify Android-only CLI
        run: cargo test -p rust_ASC --no-default-features --locked
      - name: Verify Harmony-only CLI
        run: cargo test -p rust_ASC --no-default-features --features harmony --locked
      - name: Verify Android MCP
        run: cargo test -p rust_ASC --no-default-features --features mcp --locked
